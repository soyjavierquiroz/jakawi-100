name: Documentation QA

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'app/docs/**'
      - 'bin/check-docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'app/docs/**'
      - 'bin/check-docs.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing repository pin
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check relative Markdown targets
        run: python3 bin/check-docs.py
      - name: Check changed whitespace
        run: git diff --check HEAD^ HEAD -- README.md docs app/docs bin/check-docs.py .github/workflows/docs.yml
