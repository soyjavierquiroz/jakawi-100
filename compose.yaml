services:
  web:
    image: jakawi-web
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - jakawi_public_uploads:/var/www/html/public/storage
    networks:
      - jakawi

  app:
    image: jakawi-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jakawi_public_uploads:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - jakawi

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - .env
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${MEDIA_AWS_ENDPOINT:-https://myminioback.kuruk.in}
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: ${MEDIA_AWS_DEFAULT_REGION:-us-east-1}
      IMGPROXY_S3_ALLOWED_BUCKETS: ${MEDIA_AWS_BUCKET:-jakawi-media}
      AWS_ACCESS_KEY_ID: ${IMGPROXY_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${IMGPROXY_AWS_SECRET_ACCESS_KEY}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_AUTO_WEBP: "false"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_CACHE_CONTROL: "public, max-age=31536000, immutable"
    networks:
      - jakawi

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - jakawi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jakawi

networks:
  jakawi:
    driver: bridge

volumes:
  jakawi_postgres_data:
  jakawi_public_uploads:
